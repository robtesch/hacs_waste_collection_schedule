name: Update Durban schedule calendars

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update-calendars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          ref: tooling/durban-updater

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data/durban-gov-za
          path: data-out

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install -r tools/durban_gov_za/requirements.txt

      - name: Regenerate hosted calendars
        run: python tools/durban_gov_za/update.py --output-dir data-out

      - name: Commit and push calendar updates
        working-directory: data-out
        run: |
          set -e
          if git diff --quiet; then
            echo "No calendar changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update eThekwini hosted calendars from council DOCX schedules."
          git push
