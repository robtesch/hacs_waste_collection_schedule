name: Update Durban schedule calendars

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tooling and data branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch tooling/durban-updater \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            repo
          git clone --depth 1 --branch data/durban-gov-za \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            repo/data-out

      - name: Install Python dependencies
        working-directory: repo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/durban_gov_za/requirements.txt

      - name: Regenerate hosted calendars
        working-directory: repo
        run: python3 tools/durban_gov_za/update.py --output-dir data-out

      - name: Commit and push calendar updates
        working-directory: repo/data-out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No calendar changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update eThekwini hosted calendars from council DOCX schedules."
          git push origin "HEAD:data/durban-gov-za"
