name: Update Durban schedule mapping

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install -r tools/durban_gov_za/requirements.txt

      - name: Run updater (dry run)
        id: update
        run: |
          set -e
          python tools/durban_gov_za/update.py --dry-run > /tmp/mapping-preview.txt
          python tools/durban_gov_za/update.py
          if git diff --quiet -- \
            custom_components/waste_collection_schedule/waste_collection_schedule/source/durban_gov_za.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No mapping changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue when mapping changes
        if: steps.update.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Durban schedule mapping update available";
            const body = [
              "The weekly updater detected changes in the eThekwini DOCX schedules.",
              "",
              "Review the diff on `tooling/durban-updater`, then cut a clean upstream PR branch.",
              "",
              "Fork-only tooling — do not merge this workflow or `tools/` upstream.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
